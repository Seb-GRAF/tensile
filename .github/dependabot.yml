version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /
      - /examples/consumer
      - /examples/nextjs
    schedule:
      interval: weekly
    groups:
      compatible:
        update-types: [minor, patch]
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
